approvedGitRepositories:
  - "https://github.com/tripss/**"

compressionLevel: mixed

enableGlobalCache: false

# Native addons (better-sqlite3/sqlite3) need Python + build tools on Windows.
# Keep scripts off until the toolchain is available; package compile still works.
enableScripts: false

nodeLinker: node-modules

npmMinimalAgeGate: 2d

yarnPath: .yarn/releases/yarn-4.18.0.cjs
