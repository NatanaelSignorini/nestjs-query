name: 'Setup Step'
description: 'Setup Step'
author: 'Tycho Bokdam'

runs:
  using: "composite"
  steps:
    - name: Get Node version
      id: node-version
      shell: bash
      run: echo "version=$(node --version)" >> $GITHUB_OUTPUT

    - name: Cache node modules
      id: cache
      uses: actions/cache@v6
      with:
        path: |
          ~/.cache/mongodb-memory-server
          **/node_modules
        key: cache-node-modules-${{ steps.node-version.outputs.version }}-${{ hashFiles('yarn.lock') }}

    - name: Install dependencies
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: yarn install --immutable

    # enableScripts is false (Windows-friendly); unit tests need native bindings for
    # better-sqlite3 / sqlite3. Rebuild for this Node ABI after install or cache restore.
    - name: Rebuild native modules
      shell: bash
      run: |
        npm rebuild better-sqlite3
        if [ -d node_modules/sqlite3 ]; then npm rebuild sqlite3; fi
