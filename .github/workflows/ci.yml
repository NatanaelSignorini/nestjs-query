name: CI (main)

# Full gate for production (`main` / `master` / `releases/*`) only.
# Keep this workflow off `dev` so push-to-dev never posts a skipped check named `ci`.
on:
  push:
    branches:
      - main
      - master
      - releases/*
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NX_BRANCH: ${{ github.event.number }}
  NX_RUN_GROUP: ${{ github.run_id }}

jobs:
  setup:
    uses: ./.github/workflows/shared.setup-env.yml

  check:
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [24.x, 26.x]
        target: ['build', 'test', 'lint']
    steps:
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup-step

      - name: GIT config
        if: matrix.target == 'build'
        run: |
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"

      - name: nx workspace:version
        if: matrix.target == 'build'
        run: yarn nx run workspace:version

      # Nx tsc can flake with ENOTEMPTY when clearing dist/packages/* under parallel
      # builds on Node 24 (query-graphql:build). Clean first and retry once.
      - name: Clean dist outputs
        if: matrix.target == 'build'
        run: rm -rf dist

      - name: nx affected:${{ matrix.target }}
        run: |
          if [ "${{ matrix.target }}" = "build" ]; then
            yarn nx run-many --target=build --all --parallel=1 \
              || (rm -rf dist && yarn nx run-many --target=build --all --parallel=1)
          else
            yarn nx run-many --target=${{ matrix.target }} --all
          fi
        env:
          # NestJS 12 ships ESM; Jest needs this for require(esm) under Nx.
          NODE_OPTIONS: ${{ matrix.target == 'test' && '--experimental-vm-modules' || '' }}

      - name: Codecov
        uses: codecov/codecov-action@v7
        if: matrix.target == 'test'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ./coverage
          fail_ci_if_error: false
          name: run-unit-test-${{ matrix.node-version }}

  e2e-test:
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # NestJS 12 ships ESM; Jest on Node 22 cannot load @nestjs/* (needs 24.9+ require(esm)).
        node-version: [24.x, 26.x]
        db-type: ['postgres', 'mysql']
    steps:
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup-step

      - name: docker compose
        run: docker compose -f ./examples/docker-compose.yml up -d

      - name: nx affected:e2e
        run: yarn nx run-many --target=e2e --all
        env:
          NESTJS_QUERY_DB_TYPE: ${{ matrix.db-type }}
          NODE_OPTIONS: --experimental-vm-modules

      - name: Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ./coverage
          fail_ci_if_error: false
          name: run-e2e-${{ matrix.node-version }}-${{ matrix.db-type }}

  federation-e2e-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Docker Compose
        uses: docker/setup-compose-action@v2

      - name: Build and run Federation E2E tests
        run: |
          cd examples/federation-v2-e2e
          docker compose --profile test up --build --exit-code-from e2e-test e2e-test

      - name: Show logs on failure
        if: failure()
        run: |
          cd examples/federation-v2-e2e
          docker compose logs

  # Single required status check for `main` branch protection.
  check-main-gate:
    name: check (main)
    needs: [check, e2e-test, federation-e2e-test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        run: |
          echo "check=${{ needs.check.result }}"
          echo "e2e-test=${{ needs.e2e-test.result }}"
          echo "federation-e2e-test=${{ needs.federation-e2e-test.result }}"
          if [ "${{ needs.check.result }}" != "success" ] \
            || [ "${{ needs.e2e-test.result }}" != "success" ] \
            || [ "${{ needs.federation-e2e-test.result }}" != "success" ]; then
            echo "One or more required pipeline jobs failed or were skipped"
            exit 1
          fi

  # Temporary alias while branch protection still lists `ci (main)`. Remove after protection PATCH.
  ci-main-legacy:
    name: ci (main)
    needs: [check, e2e-test, federation-e2e-test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs (legacy check name)
        run: |
          if [ "${{ needs.check.result }}" != "success" ] \
            || [ "${{ needs.e2e-test.result }}" != "success" ] \
            || [ "${{ needs.federation-e2e-test.result }}" != "success" ]; then
            echo "One or more required pipeline jobs failed or were skipped"
            exit 1
          fi
