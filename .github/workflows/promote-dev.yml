name: Promote dev to main

# After light CI (dev) succeeds on a push to `dev`, open/update a PR to `main`
# and enable auto-merge. Branch protection on `main` still requires the full
# `check (main)` check from workflow `CI (main)`.
#
# Use secrets.PROMOTE_TOKEN (classic PAT or fine-grained with contents+PR on this repo)
# so the PR is authored by a human user and CI/Code scanning run without "Approve and run".
# GITHUB_TOKEN PRs from github-actions[bot] stay stuck in action_required until approved.
on:
  workflow_run:
    workflows: ['CI (dev)']
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  promote:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'dev'
    runs-on: ubuntu-latest
    steps:
      - name: Create or refresh promote PR
        env:
          GH_TOKEN: ${{ secrets.PROMOTE_TOKEN || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [ -z "${{ secrets.PROMOTE_TOKEN }}" ]; then
            echo "::warning::PROMOTE_TOKEN is not set; using GITHUB_TOKEN. Promote PRs may require manual Approve and run for CI / Code scanning."
          fi

          existing="$(gh pr list --base main --head dev --state open --json number --jq '.[0].number // empty')"
          if [ -z "$existing" ]; then
            gh pr create \
              --base main \
              --head dev \
              --title "chore: promote dev to main" \
              --body "Automated promote from \`dev\` after light CI (\`CI (dev)\` / \`check (dev)\`) passed.

          Full CI (\`CI (main)\` / \`check (main)\`: lint/build/test matrix, e2e, federation) must pass on this PR before auto-merge into \`main\`.

          Note: \`CI (main)\` and \`CI (dev)\` are separate workflows so push-to-dev never posts a skipped check named \`check (main)\` on the same SHA."
            existing="$(gh pr list --base main --head dev --state open --json number --jq '.[0].number')"
          fi

          echo "Promote PR #$existing"
          # Keep the branch up to date when main moved (strict required checks).
          gh pr merge "$existing" --auto --merge || true
          # Update branch if GitHub reports behind (best-effort; needs admin or allow update).
          gh api -X PUT "repos/${GH_REPO}/pulls/${existing}/update-branch" || true
